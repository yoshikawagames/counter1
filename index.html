<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>来場カウント</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    .btn { font-size: 1.2rem; padding: 12px 24px; cursor: pointer; }
    .msg { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h2 id="corner-title">来場受付</h2>

  <!-- メインコンテンツ領域 -->
  <div id="action-area">
    <button id="send-btn" class="btn">来場しました！</button>
  </div>

  <!-- メッセージ表示エリア -->
  <div id="message" class="msg"></div>

  <script>
    "https://script.google.com/macros/s/AKfycbwDOwQuF7SFyK6hB6hkSQXPH4R41gRNZbc0QnMTecKxV9fjfNJPCN1c-LJmmmlKyGLT/exec";
    const COOLDOWN_MINUTES = 3; // クールダウン時間（分）

    function getCornerId() {
      const params = new URLSearchParams(window.location.search);
      const corner = params.get('corner');
      return corner ? corner.toLowerCase() : "1a";
    }

    function getUUID() {
      let uuid = localStorage.getItem('user_uuid');
      if (!uuid) {
        uuid = 'uuid-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('user_uuid', uuid);
      }
      return uuid;
    }

    const corner = getCornerId();
    const uuid = getUUID();

    document.getElementById('corner-title').textContent = `来場受付 (${corner.toUpperCase()})`;

    // クールダウン判定関数
    function checkCooldown() {
      const lastVisitKey = `last_visit_${corner}`;
      const lastVisitTime = localStorage.getItem(lastVisitKey);
      
      if (lastVisitTime) {
        const elapsedMs = Date.now() - parseInt(lastVisitTime, 10);
        const cooldownMs = COOLDOWN_MINUTES * 60 * 1000;

        if (elapsedMs < cooldownMs) {
          // まだ3分経っていない場合：ボタンを隠す
          showCooldownMessage();
          return true;
        }
      }
      return false;
    }

    // クールダウン中の画面表示
    function showCooldownMessage() {
      document.getElementById('action-area').innerHTML = `
        <div style="color: green; font-size: 1.2rem; margin: 20px 0;">
          ✅ 受付が完了しています！
        </div>
        <p style="color: #666; font-size: 0.9rem;">
          ※同じブースでの再登録は、前回の登録から3分以上経過した後にQRコードを読み直してください。
        </p>
      `;
      document.getElementById('message').textContent = "";
    }

    // ページ読み込み時にチェック（リロード対策）
    checkCooldown();

    // 送信ボタンの処理
    document.getElementById('send-btn').addEventListener('click', function() {
      // 押した瞬間に再読み込みチェック
      if (checkCooldown()) return;

      const btn = this;
      btn.disabled = true;
      document.getElementById('message').textContent = "送信中...";

      const payloadData = JSON.stringify({ uuid: uuid, corner: corner });
      const params = new URLSearchParams();
      params.append("payload", payloadData);

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
      })
      .then(() => {
        // 送信成功時：送信時刻をスマホに保存
        localStorage.setItem(`last_visit_${corner}`, Date.now().toString());
        // ボタンを消してメッセージ表示
        showCooldownMessage();
      })
      .catch(err => {
        btn.disabled = false;
        document.getElementById('message').textContent = "送信に失敗しました。もう一度お試しください。";
      });
    });
  </script>
</body>
</html>
